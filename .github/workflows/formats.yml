name: Format compatibility

on:
  pull_request:
    paths:
      - 'js/parsers.js'
      - 'js/fileOperations.js'
      - 'test/timesheet-formats.test.js'
      - 'tools/*smoke*'
      - 'tools/*scenario*'
      - 'package*.json'
      - '.github/workflows/formats.yml'

concurrency:
  group: ditis-formats-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    # This one-off format audit runs on its own PR; after merging, retain the
    # scenarios in the general check workflow instead of duplicating jobs.
    if: github.head_ref == 'fix/tdts-xdts-compatibility'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run test:run
      # Compile only: do not create app bundles, tags or releases.
      - run: npm run tauri:build -- --debug --no-bundle
      - name: Install native WebView2 drivers
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          msedgedriver-tool
          $PWD.Path >> $env:GITHUB_PATH
      - name: Prepare medium-integrity test process
        run: |
          choco install gsudo --no-progress -y
          icacls $env:GITHUB_WORKSPACE /grant '*S-1-5-32-545:(OI)(CI)F' /T /Q
      - name: Basic operations and legacy-format examples in real Windows app
        run: ./tools/run-windows-smoke.ps1
        env:
          SMOKE_SCREENSHOT_PATH: windows-formats.png
      - name: Save Windows screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-formats-screenshot
          path: windows-formats.png
          if-no-files-found: warn
